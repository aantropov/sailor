syntax = "proto3";

package sailor.editor.v1;

option csharp_namespace = "SailorEditor.Protocol.Generated";

message Empty {
}

message ProtocolRequest {
	uint32 protocol_version = 1;
	uint64 request_id = 2;

	oneof command {
		InitializeRequest initialize = 10;
		Empty start = 11;
		Empty stop = 12;
		Empty shutdown = 13;
		Empty request_asset_reload = 14;
		Empty get_asset_reload_state = 15;
		Empty get_exit_code = 16;
		CountRequest get_messages = 17;
		Empty serialize_current_world = 18;
		Empty serialize_editor_types = 19;
		Empty serialize_workspace_cache_identity = 20;
		FileIdRequest load_editor_world = 21;
		Empty create_editor_world = 22;
		ViewportRectRequest set_viewport = 23;
		SizeRequest set_editor_render_target_size = 24;
		RemoteViewportRequest upsert_remote_viewport = 25;
		ViewportIdRequest destroy_remote_viewport = 26;
		ViewportIdRequest get_remote_viewport_state = 27;
		ViewportIdRequest get_remote_viewport_diagnostics = 28;
		ViewportIdRequest retry_remote_viewport = 29;
		RemoteViewportHostRequest set_remote_viewport_mac_host_handle = 30;
		RemoteViewportInputRequest send_remote_viewport_input = 31;
		CountRequest pull_editor_viewport_events = 32;
		ManagedMutationRevisionRequest get_editor_managed_mutation_revision = 33;
		UpdateObjectRequest update_object = 34;
		ReparentObjectRequest reparent_object = 35;
		CreateGameObjectRequest create_game_object = 36;
		InstanceIdRequest destroy_object = 37;
		InstanceIdRequest reset_component_to_defaults = 38;
		AddComponentRequest add_component = 39;
		InstanceIdRequest remove_component = 40;
		InstantiatePrefabRequest instantiate_prefab = 41;
		InstantiatePrefabFromYamlRequest instantiate_prefab_from_yaml = 42;
		SelectionRequest set_editor_selection = 43;
		ShowMainWindowRequest show_main_window = 44;
		RenderPathTracedImageRequest render_path_traced_image = 45;
		Empty serialize_engine_types = 46;
		Empty is_engine_main_thread_ready = 47;
		Empty is_engine_running = 48;
		ViewportRayRequest trace_viewport_ray = 49;
		InstantiatePrefabInstanceRequest instantiate_prefab_instance = 51;
		ViewportObjectRequest focus_editor_camera = 52;
		PrefabLinkRequest set_prefab_link = 53;
		InstanceIdRequest break_prefab_link = 54;
		ViewportToolStateRequest set_viewport_tool_state = 55;
		ViewportIdRequest get_viewport_tool_state = 56;
		FileIdRequest update_asset = 57;
		CreateModelInstanceRequest create_model_instance = 58;
		AnimatorParameterRequest set_animator_parameter = 59;
		InstanceIdRequest get_animator_state = 60;
		EditorSimulationRequest set_editor_simulation = 61;
		Empty get_editor_simulation_state = 62;
		FileIdRequest preview_audio_asset = 63;
		EditorStatsModeRequest set_editor_stats_mode = 64;
		EditorRenderModeRequest set_editor_render_mode = 65;
		Empty get_editor_render_mode = 66;
		StartGIProbesBakeRequest start_gi_probes_bake = 67;
		Empty get_gi_probes_bake_status = 68;
		Empty cancel_gi_probes_bake = 69;
		SetGISettingsRequest set_gi_settings = 70;
		Empty get_global_illumination_state = 71;
		RuntimeGIProbesPreviewRequest set_runtime_gi_probes_preview = 72;
		RuntimeGIProbesPauseRequest set_runtime_gi_probes_paused = 73;
		Empty restart_runtime_gi_probes = 74;
		Empty rebuild_runtime_gi_probes_scene = 75;
		RuntimeGIProbesPreviewBudgetRequest set_runtime_gi_probes_preview_budget = 76;
	}

	reserved 3 to 9;
	reserved 50;
	reserved "create_model_game_object";
	reserved "resolve_viewport_drop_position";
	reserved 77 to 99;
}

message ProtocolResponse {
	uint32 protocol_version = 1;
	uint64 request_id = 2;
	bool success = 3;
	string error = 4;
	bool supports_strict_instance_ids = 5;

	oneof result {
		Empty empty_result = 10;
		BoolResult bool_result = 11;
		Int32Result int32_result = 12;
		UInt32Result uint32_result = 13;
		UInt64Result uint64_result = 14;
		StringResult string_result = 15;
		StringListResult string_list_result = 16;
		AssetReloadStateResult asset_reload_state_result = 17;
		InstanceIdResult instance_id_result = 18;
		ViewportEventBatchResult viewport_event_batch_result = 19;
		Vector4Result vector4_result = 20;
		ViewportToolStateResult viewport_tool_state_result = 21;
		AnimatorStateResult animator_state_result = 22;
		EditorRenderModeResult editor_render_mode_result = 23;
		GIProbesBakeStatusResult gi_probes_bake_status_result = 24;
		GlobalIlluminationStateResult global_illumination_state_result = 25;
	}

	reserved 6 to 9;
	reserved 26 to 99;
}

message InitializeRequest {
	repeated string arguments = 1;
}

message CountRequest {
	uint32 max_count = 1;
}

message FileIdRequest {
	string file_id = 1;
}

message CreateModelInstanceRequest {
	string model_file_id = 1;
	string name = 2;
	string parent_instance_id = 3;
	bool create_hierarchy = 4;
	bool apply_world_position = 5;
	Vector4 world_position = 6;
	string preferred_instance_id = 7;
}

message InstanceIdRequest {
	string instance_id = 1;
}

message ViewportIdRequest {
	uint64 viewport_id = 1;
}

message ViewportRectRequest {
	uint32 window_pos_x = 1;
	uint32 window_pos_y = 2;
	uint32 width = 3;
	uint32 height = 4;
}

message SizeRequest {
	uint32 width = 1;
	uint32 height = 2;
}

message EditorSimulationRequest {
	bool enabled = 1;
}

message EditorStatsModeRequest {
	EditorStatsMode mode = 1;
}

message EditorRenderModeRequest {
	EditorRenderMode mode = 1;
}

message EditorRenderModeResult {
	EditorRenderMode mode = 1;
}

message GIProbesBakeSettings {
	uint32 rays_per_probe = 1;
	uint32 bounce_count = 2;
	uint32 random_seed = 3;
	uint32 max_subdivision_level = 4;
	float min_probe_spacing = 5;
	float normal_bias = 6;
	float view_bias = 7;
	float max_ray_distance = 8;
	bool include_sky = 9;
	bool include_emissive = 10;
	bool include_direct_lighting = 11;
	reserved 12;
}

message StartGIProbesBakeRequest {
	string world_file_id = 1;
	string output_virtual_path = 2;
	string state_name = 3;
	string layout_source_file_id = 4;
	GIProbesBakeSettings settings = 5;
	Vector4 fallback_environment = 6;
	bool overwrite = 7;
	optional uint32 thread_count = 8;
}

message GIProbesBakeStatusResult {
	GIProbesBakeState state = 1;
	float progress = 2;
	uint32 completed_probes = 3;
	uint32 total_probes = 4;
	uint32 brick_count = 5;
	uint32 probe_count = 6;
	float elapsed_seconds = 7;
	uint64 layout_hash = 8;
	uint64 transport_hash = 9;
	uint64 lighting_hash = 10;
	string stage = 11;
	string output_virtual_path = 12;
	string diagnostic = 13;
}

message GlobalIlluminationProbeBinding {
	string name = 1;
	string asset_file_id = 2;
	GlobalIlluminationProbeMode mode = 3;
	float initial_weight = 4;
	bool preload = 5;
}

message SetGISettingsRequest {
	repeated GlobalIlluminationProbeBinding probes = 1;
	optional GlobalIlluminationMode mode = 2;
	RuntimeGIProbesSettings runtime_probes = 3;
}

message GlobalIlluminationProbeState {
	string name = 1;
	string asset_file_id = 2;
	GlobalIlluminationProbeMode mode = 3;
	float weight = 4;
	GlobalIlluminationProbeResidency residency = 5;
	uint64 asset_revision = 6;
	string diagnostic = 7;
}

message GlobalIlluminationStateResult {
	uint32 max_probe_states_per_snapshot = 1;
	repeated GlobalIlluminationProbeState probes = 2;
	string diagnostic = 3;
	uint64 composition_count = 4;
	uint64 rejected_composition_count = 5;
	GlobalIlluminationMode mode = 6;
	bool enabled = 7;
	RuntimeGIProbesSettings runtime_probes = 8;
	RuntimeGIProbesState runtime_state = 9;
}

message RemoteViewportRequest {
	uint64 viewport_id = 1;
	uint32 window_pos_x = 2;
	uint32 window_pos_y = 3;
	uint32 width = 4;
	uint32 height = 5;
	bool visible = 6;
	bool focused = 7;
}

message RemoteViewportHostRequest {
	uint64 viewport_id = 1;
	uint32 host_handle_kind = 2;
	uint64 host_handle_value = 3;
}

message RemoteViewportInputRequest {
	uint64 viewport_id = 1;
	uint32 kind = 2;
	float pointer_x = 3;
	float pointer_y = 4;
	float wheel_delta_x = 5;
	float wheel_delta_y = 6;
	uint32 key_code = 7;
	uint32 button = 8;
	uint32 modifiers = 9;
	bool pressed = 10;
	bool focused = 11;
	bool captured = 12;
}

message ManagedMutationRevisionRequest {
	uint32 kind = 1;
	string instance_id = 2;
}

message UpdateObjectRequest {
	string instance_id = 1;
	string yaml_changes = 2;
}

message ReparentObjectRequest {
	string instance_id = 1;
	string parent_instance_id = 2;
	bool keep_world_transform = 3;
}

message CreateGameObjectRequest {
	string parent_instance_id = 1;
	string preferred_instance_id = 2;
}

message AddComponentRequest {
	string instance_id = 1;
	string component_type_name = 2;
	string preferred_instance_id = 3;
}

message AnimatorParameterRequest {
	string instance_id = 1;
	string name = 2;

	oneof value {
		float float_value = 3;
		sint32 int_value = 4;
		bool bool_value = 5;
		Empty trigger = 6;
		Empty reset_trigger = 7;
	}
}

message InstantiatePrefabRequest {
	string file_id = 1;
	string parent_instance_id = 2;
}

message InstantiatePrefabFromYamlRequest {
	string prefab_yaml = 1;
	string parent_instance_id = 2;
	bool strict_instance_ids = 3;
}

message ViewportRayRequest {
	uint64 viewport_id = 1;
	float normalized_x = 2;
	float normalized_y = 3;
}

message InstantiatePrefabInstanceRequest {
	string file_id = 1;
	string parent_instance_id = 2;
	bool apply_world_position = 3;
	Vector4 world_position = 4;
}

message ViewportObjectRequest {
	uint64 viewport_id = 1;
	string instance_id = 2;
}

message PrefabLinkRequest {
	string instance_id = 1;
	string file_id = 2;
}

message ViewportToolStateRequest {
	uint64 viewport_id = 1;
	ViewportTransformOperation operation = 2;
	ViewportTransformSpace space = 3;
}

message SelectionRequest {
	repeated string instance_ids = 1;
}

message ShowMainWindowRequest {
	bool show = 1;
}

message RenderPathTracedImageRequest {
	string output_path = 1;
	string instance_id = 2;
	uint32 height = 3;
	uint32 samples_per_pixel = 4;
	uint32 max_bounces = 5;
}

message BoolResult {
	bool value = 1;
}

message Int32Result {
	int32 value = 1;
}

message UInt32Result {
	uint32 value = 1;
}

message UInt64Result {
	uint64 value = 1;
}

message StringResult {
	bool has_value = 1;
	string value = 2;
}

message StringListResult {
	repeated string values = 1;
}

message AssetReloadStateResult {
	bool available = 1;
	uint64 request_generation = 2;
	uint64 completed_generation = 3;
	uint64 successful_generation = 4;
}

message InstanceIdResult {
	bool succeeded = 1;
	string instance_id = 2;
}

message Vector4Result {
	Vector4 value = 1;
}

message ViewportToolStateResult {
	ViewportTransformOperation operation = 1;
	ViewportTransformSpace space = 2;
}

message AnimatorStateResult {
	bool has_controller = 1;
	uint64 controller_revision = 2;
	uint64 active_state_id = 3;
	string active_state_name = 4;
	float active_state_time = 5;
	bool transitioning = 6;
	uint64 destination_state_id = 7;
	string destination_state_name = 8;
	float destination_state_time = 9;
	float transition_alpha = 10;
}

enum ViewportTransformOperation {
	VIEWPORT_TRANSFORM_OPERATION_UNSPECIFIED = 0;
	VIEWPORT_TRANSFORM_OPERATION_SELECT = 1;
	VIEWPORT_TRANSFORM_OPERATION_TRANSLATE = 2;
	VIEWPORT_TRANSFORM_OPERATION_ROTATE = 3;
	VIEWPORT_TRANSFORM_OPERATION_SCALE = 4;
}

enum ViewportTransformSpace {
	VIEWPORT_TRANSFORM_SPACE_UNSPECIFIED = 0;
	VIEWPORT_TRANSFORM_SPACE_WORLD = 1;
	VIEWPORT_TRANSFORM_SPACE_LOCAL = 2;
}

enum EditorStatsMode {
	EDITOR_STATS_MODE_UNSPECIFIED = 0;
	EDITOR_STATS_MODE_NONE = 1;
	EDITOR_STATS_MODE_RENDER_STATS = 2;
	EDITOR_STATS_MODE_RENDER_STATS_AND_QUERIES = 3;
}

enum EditorRenderMode {
	EDITOR_RENDER_MODE_UNSPECIFIED = 0;
	EDITOR_RENDER_MODE_LIT = 1;
	EDITOR_RENDER_MODE_AMBIENT_OCCLUSION = 2;
	EDITOR_RENDER_MODE_CASCADES = 3;
	EDITOR_RENDER_MODE_LIGHT_TILES = 4;
	EDITOR_RENDER_MODE_GLOBAL_ILLUMINATION_ONLY = 5;
	EDITOR_RENDER_MODE_GLOBAL_ILLUMINATION_PROBES = 6;
	EDITOR_RENDER_MODE_GLOBAL_ILLUMINATION_BRICKS = 7;
	EDITOR_RENDER_MODE_GLOBAL_ILLUMINATION_VALIDITY = 8;
	EDITOR_RENDER_MODE_GLOBAL_ILLUMINATION_VISIBILITY = 9;
	EDITOR_RENDER_MODE_GLOBAL_ILLUMINATION_RESIDENCY = 10;
	EDITOR_RENDER_MODE_GLOBAL_ILLUMINATION_ASSET_IDENTITY = 11;
	EDITOR_RENDER_MODE_GLOBAL_ILLUMINATION_FALLBACK = 12;
	EDITOR_RENDER_MODE_GLOBAL_ILLUMINATION_SUBDIVISIONS = 13;
}

enum GIProbesBakeState {
	GI_PROBES_BAKE_STATE_UNSPECIFIED = 0;
	GI_PROBES_BAKE_STATE_IDLE = 1;
	GI_PROBES_BAKE_STATE_PREPARING = 2;
	GI_PROBES_BAKE_STATE_BAKING = 3;
	GI_PROBES_BAKE_STATE_SAVING = 4;
	GI_PROBES_BAKE_STATE_SUCCEEDED = 5;
	GI_PROBES_BAKE_STATE_FAILED = 6;
	GI_PROBES_BAKE_STATE_CANCELLED = 7;
}

enum GlobalIlluminationProbeMode {
	GLOBAL_ILLUMINATION_PROBE_MODE_UNSPECIFIED = 0;
	GLOBAL_ILLUMINATION_PROBE_MODE_BLEND = 1;
	GLOBAL_ILLUMINATION_PROBE_MODE_ADDITIVE = 2;
}

enum GlobalIlluminationMode {
	GLOBAL_ILLUMINATION_MODE_UNSPECIFIED = 0;
	GLOBAL_ILLUMINATION_MODE_NO_GI = 1;
	GLOBAL_ILLUMINATION_MODE_RUNTIME = 2;
	GLOBAL_ILLUMINATION_MODE_BAKED = 3;
}

enum RuntimeGIProbesLifecycle {
	RUNTIME_GI_PROBES_LIFECYCLE_UNSPECIFIED = 0;
	RUNTIME_GI_PROBES_LIFECYCLE_DISABLED = 1;
	RUNTIME_GI_PROBES_LIFECYCLE_PREPARING_SCENE = 2;
	RUNTIME_GI_PROBES_LIFECYCLE_TRACING = 3;
	RUNTIME_GI_PROBES_LIFECYCLE_READY = 4;
	RUNTIME_GI_PROBES_LIFECYCLE_PAUSED = 5;
	RUNTIME_GI_PROBES_LIFECYCLE_THROTTLED = 6;
	RUNTIME_GI_PROBES_LIFECYCLE_FAILED = 7;
}

enum RuntimeGIProbesPreviewBudget {
	RUNTIME_GI_PROBES_PREVIEW_BUDGET_UNSPECIFIED = 0;
	RUNTIME_GI_PROBES_PREVIEW_BUDGET_ECO = 1;
	RUNTIME_GI_PROBES_PREVIEW_BUDGET_BALANCED = 2;
}

enum GlobalIlluminationProbeResidency {
	GLOBAL_ILLUMINATION_PROBE_RESIDENCY_UNSPECIFIED = 0;
	GLOBAL_ILLUMINATION_PROBE_RESIDENCY_UNLOADED = 1;
	GLOBAL_ILLUMINATION_PROBE_RESIDENCY_LOADING = 2;
	GLOBAL_ILLUMINATION_PROBE_RESIDENCY_RESIDENT = 3;
	GLOBAL_ILLUMINATION_PROBE_RESIDENCY_FAILED = 4;
}

message Vector4 {
	float x = 1;
	float y = 2;
	float z = 3;
	float w = 4;
}

message ViewportSelectionEvent {
	string selected_instance_id = 1;
}

message ViewportTransformEvent {
	string instance_id = 1;
	ViewportTransformOperation operation = 2;
	ViewportTransformSpace space = 3;
	Vector4 before_position = 4;
	Vector4 before_rotation = 5;
	Vector4 before_scale = 6;
	Vector4 after_position = 7;
	Vector4 after_rotation = 8;
	Vector4 after_scale = 9;
}

message ViewportAssetDropEvent {
	string file_id = 1;
	float normalized_x = 2;
	float normalized_y = 3;
}

message ViewportToolShortcutEvent {
	uint32 key_code = 1;
}

message ViewportEvent {
	uint64 revision = 1;
	uint64 managed_mutation_revision = 2;

	oneof payload {
		ViewportSelectionEvent selection = 10;
		ViewportTransformEvent transform = 11;
		ViewportAssetDropEvent asset_drop = 12;
		ViewportToolShortcutEvent tool_shortcut = 13;
	}

	reserved 3 to 9;
}

message ViewportEventBatchResult {
	repeated ViewportEvent events = 1;
}

message RuntimeGIProbesSettings {
	uint32 version = 1;
	bool include_sky = 2;
	bool include_emissive = 3;
	bool include_direct_lighting = 4;
	uint32 bounce_count = 5;
	float min_probe_spacing = 6;
	float normal_bias = 7;
	float view_bias = 8;
	float max_ray_distance = 9;
}

message RuntimeGIProbesPreviewRequest {
	bool enabled = 1;
}

message RuntimeGIProbesPauseRequest {
	bool paused = 1;
}

message RuntimeGIProbesState {
	RuntimeGIProbesLifecycle lifecycle = 1;
	bool enabled = 2;
	bool paused = 3;
	bool preview_enabled = 4;
	uint64 scene_generation = 5;
	uint64 lighting_generation = 6;
	uint64 published_revision = 7;
	uint32 capacity = 8;
	uint32 active_probe_count = 9;
	uint32 ready_probe_count = 10;
	uint32 worker_count = 11;
	uint64 published_bytes = 12;
	float coverage = 13;
	float refinement = 14;
	string diagnostic = 15;
	RuntimeGIProbesPreviewBudget preview_budget = 16;
}

message RuntimeGIProbesPreviewBudgetRequest {
	RuntimeGIProbesPreviewBudget budget = 1;
}
