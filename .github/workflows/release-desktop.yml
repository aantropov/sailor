name: Release / Desktop

'on':
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release after all checks pass (owner only, main branch)
        type: boolean
        default: false
      prerelease:
        description: Mark the GitHub Release as a prerelease
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release-desktop.yml
      - Tools/Release/**
      - Tests/ReleasePackagingTests.py
      - Tests/ReleaseSdkProbe/**
      - VERSION
      - Directory.Build.props
      - CMake/SailorConfig.cmake.in
      - Editor.Linux/**
      - Editor/Services/AssetsService.cs
      - Editor/Services/EngineService.cs
      - Editor/Services/EngineLaunchContract.cs
      - Editor.Tests/EngineIntegration/**

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_MAX_CONCURRENCY: 2

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release contracts
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s Tests -p ReleasePackagingTests.py -v
      - name: Read and validate release identity
        id: version
        shell: bash
        env:
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python Tools/Release/release_identity.py --github-output "$GITHUB_OUTPUT"
          if [ "$PUBLISH" = true ]; then
            test "$ACTOR" = "$OWNER"
            test "$REF" = refs/heads/main
          fi

  build:
    needs: validate
    name: Package / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows x64
            target: windows-x64
            rid: win-x64
            framework: net10.0-windows10.0.19041.0
            triplet: x64-windows
            sdk: 10.0.404
            workload: 10.0.404
          - os: xcode-27
            platform: macOS arm64
            target: macos-arm64
            rid: maccatalyst-arm64
            framework: net10.0-maccatalyst
            triplet: arm64-osx
            sdk: 10.0.301
            workload: 10.0.301.1
            xcode: '27.2'
          - os: ubuntu-24.04
            platform: Linux x64
            target: linux-x64
            rid: linux-x64
            framework: net10.0
            triplet: x64-linux
            sdk: 10.0.404
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            ${{ matrix.sdk }}
      - name: Pin the SDK used by release commands
        shell: bash
        env:
          SAILOR_RELEASE_SDK: ${{ matrix.sdk }}
        run: |
          dotnet new globaljson --sdk-version "$SAILOR_RELEASE_SDK" --roll-forward disable
          dotnet --version
      - name: Select the macOS release Xcode
        if: runner.os == 'macOS'
        env:
          SAILOR_RELEASE_XCODE: ${{ matrix.xcode }}
        run: |
          sudo xcode-select --switch "/Applications/Xcode_${SAILOR_RELEASE_XCODE}.app/Contents/Developer"
          xcodebuild -version
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Vulkan SDK on Windows
        if: runner.os == 'Windows'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.3.296.0
          cache: true
      - name: Install macOS native dependencies
        if: runner.os == 'macOS'
        run: brew install vulkan-headers molten-vk shaderc ninja
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build pkg-config autoconf automake libtool \
            libvulkan-dev libshaderc-dev glslc glslang-tools libssl-dev libasound2-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libgtk-4-dev
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
      - name: Cache vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: release-vcpkg-${{ matrix.target }}-${{ hashFiles('.gitmodules', 'update_deps.py', '.github/vcpkg-ports/**') }}
          restore-keys: |
            release-vcpkg-${{ matrix.target }}-
            ${{ runner.os == 'Linux' && 'vcpkg-linux-clang18-' || '' }}
      - name: Install engine dependencies
        run: python update_deps.py
      - name: Save installed dependency binaries
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Configure native runtime and opt-in tests
        shell: bash
        run: >-
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release
          -DSAILOR_BUILD_TESTS=ON -DSAILOR_ALLOW_MISSING_DEPS=OFF
          -DCMAKE_TOOLCHAIN_FILE=External/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: Build native runtime and tests
        run: cmake --build build-release --config Release --parallel 2
      - name: Test native runtime
        run: ctest --test-dir build-release -C Release --output-on-failure
      - name: Test editor contracts
        run: dotnet test Editor.Tests/Editor.Contracts.Tests.csproj -c Release
      - name: Test prefab asset publication through the editor service
        if: runner.os == 'macOS'
        run: >-
          dotnet test Editor.Tests/EngineIntegration/Editor.Engine.Integration.Tests.csproj
          -c Release --filter FullyQualifiedName~PrefabAssetCreationTests
      - name: Install editor workload
        if: runner.os != 'Linux'
        shell: bash
        env:
          SAILOR_RELEASE_WORKLOAD: ${{ matrix.workload }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            dotnet workload install maui-maccatalyst --version "$SAILOR_RELEASE_WORKLOAD"
          else
            dotnet workload install maui-windows --version "$SAILOR_RELEASE_WORKLOAD"
          fi
      - name: Publish portable Windows editor
        if: runner.os == 'Windows'
        run: >-
          dotnet publish Editor/SailorEditor.csproj -c Release
          -f net10.0-windows10.0.19041.0 -r win-x64 --self-contained true
          -p:SailorReleaseTargetFramework=net10.0-windows10.0.19041.0
          -p:WindowsPackageType=None -p:WindowsAppSDKSelfContained=true
          -p:SailorNativeBuildDirectory=${{ github.workspace }}/build-release
          -o release-editor
      - name: Build macOS editor application
        if: runner.os == 'macOS'
        run: >-
          dotnet build Editor/SailorEditor.csproj -c Release
          -f net10.0-maccatalyst -r maccatalyst-arm64
          -p:SailorReleaseTargetFramework=net10.0-maccatalyst
          -p:SailorNativeBuildDirectory=${{ github.workspace }}/build-release
      - name: Publish portable Linux editor
        if: runner.os == 'Linux'
        run: >-
          dotnet publish Editor.Linux/SailorEditor.Linux.csproj -c Release
          -f net10.0 -r linux-x64 --self-contained true
          -p:SailorNativeBuildDirectory=${{ github.workspace }}/build-release
          -o release-editor
      - name: Publish command-line tools
        shell: bash
        run: |
          tool_rid=win-x64
          if [ "$RUNNER_OS" = macOS ]; then tool_rid=osx-arm64; fi
          if [ "$RUNNER_OS" = Linux ]; then tool_rid=linux-x64; fi
          dotnet publish Editor/McpBridge/SailorEditor.McpBridge.csproj -c Release -r "$tool_rid" --self-contained true -o release-bridge
          dotnet publish Tools/SailorBuild/SailorBuild.csproj -c Release -r "$tool_rid" --self-contained true -o release-cli
      - name: Package matching editor, runtime, SDK and content
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TRIPLET: ${{ matrix.triplet }}
        run: |
          editor=release-editor
          if [ "$RUNNER_OS" = macOS ]; then
            editor=Binaries/Editor/Release/net10.0-maccatalyst/maccatalyst-arm64/SailorEditor.app
          fi
          python Tools/Release/package_release.py --build-dir build-release --editor "$editor" \
            --dependencies "External/vcpkg/installed/$TRIPLET" --bridge release-bridge --cli release-cli --output release-assets
      - name: Verify extracted runtime and compile an external SDK consumer
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: python Tools/Release/verify_package.py --assets release-assets --target "$TARGET"
      - name: Upload reviewable release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sailor-${{ needs.validate.outputs.version }}-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [validate, build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Sailor-${{ needs.validate.outputs.version }}-*
          path: release-assets
          merge-multiple: true
      - name: Publish checked artifacts without replacing an existing tag/release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: python Tools/Release/publish_release.py --assets release-assets --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"
