name: CI / Linux

'on':
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    name: Select component checks
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.select.outputs.engine }}
      editor: ${{ steps.select.outputs.editor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test CI routing
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s Tests -p CiWorkflowTests.py -v
      - name: Select checks from changed files
        id: select
        run: python Tools/CI/select_checks.py

  engine:
    name: Linux / Engine & SDK / Clang
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-24.04
    env:
      CC: clang-18
      CXX: clang++-18
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 ninja-build pkg-config autoconf automake libtool \
            libvulkan-dev libshaderc-dev glslc glslang-tools libssl-dev libasound2-dev \
            libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev libgtk-4-dev xvfb xauth
      - uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-clang18-${{ hashFiles('.gitmodules', 'update_deps.py', '.github/vcpkg-ports/**') }}
          restore-keys: vcpkg-linux-clang18-
      - name: Install engine dependencies
        run: python3 update_deps.py
      - name: Configure runtime and opt-in tests
        run: >-
          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=External/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DSAILOR_ALLOW_MISSING_DEPS=OFF -DSAILOR_BUILD_TESTS=ON
      - name: Build runtime and tests
        run: cmake --build build-linux --parallel 2
      - name: Run native tests
        run: ctest --test-dir build-linux --output-on-failure
      - name: Package standalone runtime
        run: python3 package_linux.py --output "$RUNNER_TEMP/Sailor-Linux"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Test editor contracts
        run: dotnet test Editor.Tests/Editor.Contracts.Tests.csproj -c Release
      - name: Validate standalone game export through the installed SDK
        run: dotnet test Editor.Tests/Editor.Contracts.Tests.csproj -c Release --filter FullyQualifiedName~GameBuildNativeTests
        env:
          SAILOR_GAME_EXPORT_ENGINE: ${{ github.workspace }}
          SAILOR_GAME_EXPORT_BUILD: ${{ github.workspace }}/build-linux

  editor:
    name: Linux / Editor & Tools
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install GTK4 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Build GTK4 editor and MCP bridge
        run: python3 build_editor.py --config Release
      - name: Test editor contracts
        run: dotnet test Editor.Tests/Editor.Contracts.Tests.csproj -c Release
      - name: Build game export CLI
        run: dotnet build Tools/SailorBuild/SailorBuild.csproj -c Release
