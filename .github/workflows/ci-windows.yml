name: CI / Windows

'on':
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

env:
  BUILD_TYPE: Release
  VCPKG_ROOT: ${{ github.workspace }}/External/vcpkg
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/.github/vcpkg-triplets

jobs:
  changes:
    name: Select component checks
    runs-on: ubuntu-24.04
    outputs:
      engine: ${{ steps.select.outputs.engine }}
      editor: ${{ steps.select.outputs.editor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test CI routing
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s Tests -p CiWorkflowTests.py -v
      - name: Select checks from changed files
        id: select
        run: python Tools/CI/select_checks.py

  engine:
    name: Windows / Engine & SDK / ${{ matrix.compiler }}
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
        - compiler: MSVC
          cmake_toolset_argument: ""
          sailor_toolset: ""
        - compiler: clang-cl
          cmake_toolset_argument: -T ClangCL
          sailor_toolset: ClangCL

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Update submodules
      run: git submodule update --init --recursive

    - name: Resolve vcpkg revision
      id: vcpkg
      shell: pwsh
      run: |
        "revision=$(git -C $env:VCPKG_ROOT rev-parse HEAD)" >> $env:GITHUB_OUTPUT

    - name: Cache vcpkg installed packages
      uses: actions/cache@v4
      with:
        path: |
          ${{ env.VCPKG_ROOT }}/installed
          ${{ env.VCPKG_ROOT }}/packages
        key: vcpkg-${{ runner.os }}-${{ matrix.compiler }}-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('update_deps.py', '.github/vcpkg-ports/**', '.github/vcpkg-triplets/**') }}-installed-${{ env.BUILD_TYPE }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ matrix.compiler }}-${{ steps.vcpkg.outputs.revision }}-${{ hashFiles('update_deps.py', '.github/vcpkg-ports/**', '.github/vcpkg-triplets/**') }}-installed-

    - name: Show CMake version
      run: cmake --version

    - name: Install dependencies
      run: python update_deps.py

    - name: Install Vulkan SDK
      uses: humbletim/install-vulkan-sdk@v1.2
      with:
        version: 1.3.296.0
        cache: true


    - name: Configure CMake
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 ${{ matrix.cmake_toolset_argument }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DSAILOR_BUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

    - name: Build
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Test
      working-directory: build
      run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

    - name: Install Sailor CMake package
      run: cmake --install build --config ${{ env.BUILD_TYPE }} --prefix build/install

    - name: Set up .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Test editor contracts
      run: dotnet test Editor.Tests/Editor.Contracts.Tests.csproj --configuration Release

    - name: Validate standalone game export through the installed SDK
      run: dotnet test Editor.Tests/Editor.Contracts.Tests.csproj --configuration Release --filter FullyQualifiedName~GameBuildNativeTests
      env:
        SAILOR_GAME_EXPORT_ENGINE: ${{ github.workspace }}
        SAILOR_GAME_EXPORT_BUILD: ${{ github.workspace }}/build

    - name: Validate source workspace project
      run: >-
        dotnet test Editor.Tests/Editor.Contracts.Tests.csproj
        --configuration Release
        --filter "FullyQualifiedName~SailorEditor.Editor.Tests.WorkspaceProjectGeneratorIntegrationTests"
      env:
        SAILOR_RUN_CMAKE_INTEGRATION: 1
        SAILOR_ENGINE_SOURCE_DIR: ${{ github.workspace }}
        SAILOR_CMAKE_GENERATOR: Visual Studio 17 2022
        SAILOR_CMAKE_ARCHITECTURE: x64
        SAILOR_CMAKE_TOOLSET: ${{ matrix.sailor_toolset }}
        SAILOR_CMAKE_TOOLCHAIN_FILE: ${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

    - name: Mount runtime content for installed workspace checks
      shell: pwsh
      run: New-Item -ItemType Junction -Path build/install/Content -Target "${{ github.workspace }}/Content" | Out-Null

    - name: Validate two-workspace phase 1
      run: >-
        dotnet test Editor.Tests/Editor.Contracts.Tests.csproj
        --configuration Release
        --filter "FullyQualifiedName=SailorEditor.Editor.Tests.WorkspaceTwoWorkspaceCloseoutIntegrationTests.Phase1_CreatesBuildsActivatesSavesAndPersistsScenario"
      env:
        SAILOR_RUN_CMAKE_INTEGRATION: 1
        SAILOR_WORKSPACE_CATALOG_HOST: ${{ github.workspace }}/build/Tests/Release/WorkspaceModuleCatalogHost.exe
        SAILOR_WORKSPACE_E2E_ROOT: ${{ runner.temp }}\sailor-workspace-e2e-${{ matrix.compiler }}
        SAILOR_ENGINE_INSTALL_PREFIX: ${{ github.workspace }}/build/install
        SAILOR_CMAKE_GENERATOR: Visual Studio 17 2022
        SAILOR_CMAKE_ARCHITECTURE: x64
        SAILOR_CMAKE_TOOLSET: ${{ matrix.sailor_toolset }}
        SAILOR_CMAKE_TOOLCHAIN_FILE: ${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

    - name: Validate two-workspace phase 2 in a fresh process
      run: >-
        dotnet test Editor.Tests/Editor.Contracts.Tests.csproj
        --configuration Release
        --filter "FullyQualifiedName=SailorEditor.Editor.Tests.WorkspaceTwoWorkspaceCloseoutIntegrationTests.Phase2_FreshProcessReopensValidatesAndCleansScenario"
      env:
        SAILOR_RUN_CMAKE_INTEGRATION: 1
        SAILOR_WORKSPACE_CATALOG_HOST: ${{ github.workspace }}/build/Tests/Release/WorkspaceModuleCatalogHost.exe
        SAILOR_WORKSPACE_E2E_ROOT: ${{ runner.temp }}\sailor-workspace-e2e-${{ matrix.compiler }}
        SAILOR_ENGINE_INSTALL_PREFIX: ${{ github.workspace }}/build/install
        SAILOR_CMAKE_GENERATOR: Visual Studio 17 2022
        SAILOR_CMAKE_ARCHITECTURE: x64
        SAILOR_CMAKE_TOOLSET: ${{ matrix.sailor_toolset }}
        SAILOR_CMAKE_TOOLCHAIN_FILE: ${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake

  editor:
    name: Windows / Editor & Tools
    needs: changes
    if: needs.changes.outputs.editor == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - name: Install MAUI workload
        run: dotnet workload install maui
      - name: Build editor
        run: dotnet build Editor/SailorEditor.csproj -c Release -f net10.0-windows10.0.19041.0
      - name: Test editor contracts
        run: dotnet test Editor.Tests/Editor.Contracts.Tests.csproj -c Release
      - name: Build MCP bridge
        run: dotnet build Editor/McpBridge/SailorEditor.McpBridge.csproj -c Release
      - name: Build game export CLI
        run: dotnet build Tools/SailorBuild/SailorBuild.csproj -c Release
